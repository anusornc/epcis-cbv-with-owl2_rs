[package]
name = "epcis-knowledge-graph"
version = "0.2.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "EPCIS Blockchain with Knowledge Graph - OWL2 reasoning, PoA consensus, and supply chain traceability"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/epcis-knowledge-graph"
keywords = ["epcis", "blockchain", "knowledge-graph", "owl2", "supply-chain", "traceability"]
categories = ["database", "web-programming", "science", "cryptography"]

[dependencies]
# OWL2 Reasoner - Full SROIQ(D) with EPCIS 2.0 support
owl2-reasoner = { git = "https://github.com/anusornc/owl2-reasoner" }

# RDF ecosystem - Using parsing components and in-memory SPARQL evaluation
oxrdf = "0.2"
oxsdatatypes = "0.2"
oxttl = "0.1"
spargebra = "0.3"  # SPARQL parsing
spareval = "0.1"  # SPARQL evaluation
sparesults = "0.2"  # SPARQL results handling

# Web framework and async
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.36"

# Error handling and utilities
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI and configuration
clap = { version = "4.0", features = ["derive"] }
toml = "0.8"
config = "0.14"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Parallel processing
rayon = "1.8"

# Blockchain cryptography
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["serde"] }
hex = "0.4"
bs58 = "0.5"

# Networking (for P2P blockchain)
libp2p = { version = "0.53", features = ["tcp", "dns", "gossipsub", "identify", "kad", "noise", "yamux"] }
tokio-util = "0.7"

# Concurrent data structures
dashmap = "5.5"

# Serialization (blockchain)
bincode = "1.3"

# Basic web utilities for simple frontend
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
web-sys = "0.3"
js-sys = "0.3"

# Test dependencies
urlencoding = "2.1"
parking_lot = "0.12.4"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"
tokio-test = "0.4"

# [[bench]]
# name = "performance"
# harness = false
